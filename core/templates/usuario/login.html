<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Consejo de los Nigromantes | Iniciar Sesión</title>
  
  {% load static %}
  
  <!-- Google Fonts: Plus Jakarta Sans & Cormorant Garamond / Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="{% static 'css/usuarios/login.css' %}">
</head>
<body>
  <!-- Ambient Backdrop & Sparks -->
  <div class="bg-overlay"></div>
  <div class="ambient-particles">
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
  </div>

  <main class="login-stage">
    <!-- Left Flavour Lore Text -->
    <div class="lore-container">
      <p class="lore-text">
        Únete al Consejo y descubre<br>
        los secretos de la Nigromancia...
      </p>
      <div class="lore-skull-divider">
        <span class="line"></span>
        <svg class="lore-skull-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <!-- Skull Face -->
          <path d="M12 2C7.58 2 4 5.58 4 10C4 12.8 5.43 15.26 7.6 16.7L7.5 20C7.5 20.55 7.95 21 8.5 21H15.5C16.05 21 16.5 20.55 16.5 20L16.4 16.7C18.57 15.26 20 12.8 20 10C20 5.58 16.42 2 12 2Z" fill="#c084fc"/>
          <!-- Eyes -->
          <ellipse cx="8.5" cy="10.5" rx="1.8" ry="2.2" fill="#090414"/>
          <ellipse cx="15.5" cy="10.5" rx="1.8" ry="2.2" fill="#090414"/>
          <!-- Nose Cavity -->
          <polygon points="12,12.8 10.8,14.8 13.2,14.8" fill="#090414"/>
          <!-- Teeth / Jaw slits -->
          <rect x="9.5" y="17.5" width="1.2" height="2.5" rx="0.5" fill="#090414"/>
          <rect x="11.4" y="17.5" width="1.2" height="2.5" rx="0.5" fill="#090414"/>
          <rect x="13.3" y="17.5" width="1.2" height="2.5" rx="0.5" fill="#090414"/>
        </svg>
        <span class="line"></span>
      </div>
    </div>

    <!-- Right Login Column -->
    <div class="login-column">
      <!-- Title Header Logo Crest -->
      <div class="title-crest-wrapper">
        <img src="{% static 'img/title_crest_clean.png' %}" alt="El Consejo de los Nigromantes" class="title-crest-img">
        <div class="title-slogan">Domina el conocimiento. Protege el equilibrio.</div>
      </div>

      <!-- Main Login Card -->
      <div class="login-card">
        <!-- 4 Ornate Gothic Corners -->
        <div class="corner corner-tl">
          <svg class="corner-svg" viewBox="0 0 24 24" fill="none">
            <path d="M2 22 L2 6 C2 3.79 3.79 2 6 2 L22 2" stroke="#c084fc" stroke-width="2"/>
            <rect x="1" y="1" width="4" height="4" fill="#f5d0fe"/>
            <polygon points="12,2 14,4 12,6 10,4" fill="#e879f9"/>
            <polygon points="2,12 4,14 2,16 0,14" fill="#e879f9"/>
          </svg>
        </div>
        <div class="corner corner-tr">
          <svg class="corner-svg" viewBox="0 0 24 24" fill="none">
            <path d="M22 22 L22 6 C22 3.79 20.21 2 18 2 L2 2" stroke="#c084fc" stroke-width="2"/>
            <rect x="19" y="1" width="4" height="4" fill="#f5d0fe"/>
            <polygon points="12,2 14,4 12,6 10,4" fill="#e879f9"/>
            <polygon points="22,12 24,14 22,16 20,14" fill="#e879f9"/>
          </svg>
        </div>
        <div class="corner corner-bl">
          <svg class="corner-svg" viewBox="0 0 24 24" fill="none">
            <path d="M2 2 L2 18 C2 20.21 3.79 22 6 22 L22 22" stroke="#c084fc" stroke-width="2"/>
            <rect x="1" y="19" width="4" height="4" fill="#f5d0fe"/>
            <polygon points="12,22 14,24 12,26 10,24" fill="#e879f9"/>
            <polygon points="2,12 4,10 2,8 0,10" fill="#e879f9"/>
          </svg>
        </div>
        <div class="corner corner-br">
          <svg class="corner-svg" viewBox="0 0 24 24" fill="none">
            <path d="M22 2 L22 18 C22 20.21 20.21 22 18 22 L2 22" stroke="#c084fc" stroke-width="2"/>
            <rect x="19" y="19" width="4" height="4" fill="#f5d0fe"/>
            <polygon points="12,22 14,24 12,26 10,24" fill="#e879f9"/>
            <polygon points="22,12 24,10 22,8 20,10" fill="#e879f9"/>
          </svg>
        </div>

        {% if error_msg %}
        <div class="error-banner">
          <i class="bi bi-exclamation-triangle-fill" style="font-size: 16px;"></i>
          <span>{{ error_msg }}</span>
        </div>
        {% endif %}

        <form method="POST" action="">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <!-- Username / Email Input -->
          <div class="form-group">
            <div class="input-wrapper">
              <i class="bi bi-person-fill input-icon-left"></i>
              <input type="text" id="inputUsername" name="username" class="gothic-input" placeholder="Usuario o correo electrónico" required autofocus autocomplete="username">
            </div>
          </div>

          <!-- Password Input with Toggle Eye -->
          <div class="form-group">
            <div class="input-wrapper">
              <i class="bi bi-lock-fill input-icon-left"></i>
              <input type="password" id="inputPassword" name="password" class="gothic-input" placeholder="Contraseña" required autocomplete="current-password">
              <button type="button" class="btn-toggle-eye" id="togglePasswordBtn" title="Mostrar/Ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
                <i class="bi bi-eye-slash-fill" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <!-- Primary Submit Button -->
          <button type="submit" class="btn-submit-main">
            <!-- Crossed Swords Fantasy SVG Icon -->
            <svg class="btn-swords-icon" viewBox="0 0 32 32" fill="none">
              <!-- Left Sword Blade -->
              <path d="M7 25 L24 8 M24 8 L27 5 L24 5 L7 22 M24 8 L27 11 L27 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Left Sword Guard & Hilt -->
              <path d="M5 23 L9 27 M6 26 L3 29" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
              <!-- Right Sword Blade -->
              <path d="M25 25 L8 8 M8 8 L5 5 L8 5 L25 22 M8 8 L5 11 L5 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Right Sword Guard & Hilt -->
              <path d="M27 23 L23 27 M26 26 L29 29" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
              <!-- Center Glow Diamond -->
              <polygon points="16,13 19,16 16,19 13,16" fill="#f5d0fe"/>
            </svg>
            <span>Iniciar Sesión</span>
          </button>
        </form>

        <!-- Divider 'o' -->
        <div class="divider-row">
          <div class="divider-line"></div>
          <span class="divider-letter">o</span>
          <div class="divider-line"></div>
        </div>

        <!-- Google Sign-In Button -->
        <button type="button" class="btn-google-sign" id="googleLoginBtn">
          <!-- Official Google Logo SVG -->
          <svg class="google-icon-svg" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.26v3.13C3.26 21.3 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.61H1.26C.46 8.23 0 10.06 0 12s.46 3.77 1.26 5.39l4.02-3.13z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.7 1.26 6.61l4.02 3.13c.95-2.84 3.6-4.99 6.72-4.99z"/>
          </svg>
          <span>Iniciar con Google</span>
        </button>

        <!-- Forgot Password Link -->
        <div class="forgot-link-wrap">
          <a class="forgot-link" id="forgotPwdLink">¿Olvidaste tu contraseña?</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Developer Quick Test Pill & Panel -->
  <button type="button" class="dev-access-toggle" id="devToggleBtn" title="Rellenar credenciales de prueba">
    <i class="bi bi-lightning-charge-fill" style="color: #fbbf24;"></i>
    <span>Acceso Rápido</span>
  </button>

  <div class="dev-access-panel" id="devPanel">
    <div class="dev-panel-title">
      <span>Cuentas de Prueba</span>
      <i class="bi bi-x-lg" style="cursor: pointer;" id="closeDevPanelBtn"></i>
    </div>
    <button type="button" class="dev-btn-role" onclick="quickFill('AdminCompliance', 'Admin123*')">
      <div>
        <i class="bi bi-shield-lock-fill" style="color: #c084fc; margin-right: 6px;"></i>
        <strong>Administrador</strong>
      </div>
      <span class="role-tag">AdminCompliance</span>
    </button>
    <button type="button" class="dev-btn-role" onclick="quickFill('camirojas', 'Admin123*')">
      <div>
        <i class="bi bi-controller" style="color: #38bdf8; margin-right: 6px;"></i>
        <strong>Jugador / Empleado</strong>
      </div>
      <span class="role-tag">camirojas</span>
    </button>
  </div>

  <!-- Info Modal -->
  <div class="gothic-modal-backdrop" id="gothicModal">
    <div class="gothic-modal-card">
      <div class="gothic-modal-title" id="modalTitle">El Consejo de los Nigromantes</div>
      <p class="gothic-modal-desc" id="modalDesc"></p>
      <button type="button" class="btn-modal-close" id="modalCloseBtn">Entendido</button>
    </div>
  </div>

  <script src="{% static 'js/usuario/login.js' %}"></script>
</body>
</html>
